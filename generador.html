<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1990 — Generador</title>
<meta name="description" content="Generador de pósters A3. Cada póster es único.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22black%22/><text x=%2250%22 y=%2265%22 font-size=%2238%22 font-family=%22Arial%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22>1990</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--paper:#fff;--grey:#8a8a8a;--pad:clamp(16px,3vw,40px)}
html[data-modo=dark]{--ink:#fff;--paper:#000}
*{box-sizing:border-box;margin:0}
body{font-family:"Inter Tight","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.volver{position:fixed;top:var(--pad);left:var(--pad);z-index:5;font-weight:800;font-size:18px;letter-spacing:-.03em;color:var(--ink);text-decoration:none;background:var(--paper);padding:2px 10px 2px 0}
main{display:grid;gap:28px;padding:calc(var(--pad) + 52px) var(--pad) var(--pad);max-width:1400px;margin:0 auto}
@media(min-width:900px){main{grid-template-columns:minmax(260px,1fr) minmax(0,1.25fr);align-items:start}.lado{position:sticky;top:calc(var(--pad) + 52px)}}
h1{font-size:clamp(44px,7vw,96px);font-weight:800;letter-spacing:-.06em;line-height:.9}
.txt{margin:18px 0 26px;font-size:clamp(15px,1.4vw,18px);line-height:1.4;max-width:30em}
.txt+.txt{margin-top:-14px;color:var(--grey);font-size:14px}
.tit span{display:inline-block;overflow:hidden;vertical-align:top;height:.9em}
.tit span i{display:block;font-style:normal}
.nuevo{display:block;width:100%;max-width:420px;margin:0 0 18px;padding:18px 22px;background:var(--ink);color:var(--paper);font-weight:700;font-size:clamp(18px,1.8vw,22px);letter-spacing:-.02em;text-align:left;transition:transform .15s}
.nuevo:hover{transform:translateY(-2px)}.nuevo:active{transform:translateY(1px)}
.acc{display:flex;flex-wrap:wrap;gap:10px 24px;font-weight:700;font-size:17px}
.acc button{padding:4px 0;border-bottom:2px solid var(--ink)}
.acc button.sec{border-bottom-width:1px;font-weight:500}
.acc button:disabled{opacity:.4;cursor:wait}
.est{margin-top:14px;color:var(--grey);font-size:13px;min-height:1.3em}
.lienzo{width:100%;max-width:calc(80vh/1.414);margin:0 auto;aspect-ratio:297/420;box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 18%,transparent)}
.lienzo canvas{width:100%;height:100%;display:block}
@media(max-width:899px){.lienzo{max-width:none}.txt{font-size:14px;margin:10px 0 16px}}
</style>
<script>try{var m=localStorage.getItem("1990-modo");if(m==="dark")document.documentElement.dataset.modo="dark"}catch(e){}</script>
</head>
<body>
<a class="volver" href="index.html">← 1990</a>
<main>
  <div class="lado">
    <h1 class="tit" id="tit" aria-label="Generador">Generador</h1>
    <p class="txt">Cada póster se arma solo con reglas del archivo y el azar. No hay dos iguales.</p>
    <p class="txt">Si lo compartís, hacémelo saber :)</p>
    <button class="nuevo" id="gen">Click para nuevo póster</button>
    <div class="acc">
      <button id="png" class="sec">PNG web</button>
      <button id="pdf" class="sec">PDF A3</button>
      <button id="link" class="sec">Copiar enlace</button>
    </div>
    <p class="est" id="est" aria-live="polite"></p>
  </div>
  <div class="lienzo"><canvas id="cv" aria-label="Póster generado"></canvas></div>
</main>
<script>
/* ============================================================
   GENERADOR 1990 — pósters A3 hechos por código
   poster(canvas, semilla, dpi, fecha, dpiEtiqueta)
   Estilos: minimal · maximal · grafico · color · manifiesto
   ============================================================ */
const PAL=[["#051D94","Azul profundo"],["#4C2EB6","Violeta"],["#3C62CC","Azul"],["#9A92C3","Lila"],["#F39859","Naranja"],["#FB86E2","Rosa"],["#FC4049","Rojo"]];
const PALC=PAL.map(p=>p[0]);
const OSC=new Set(["#000000","#051D94","#4C2EB6","#3C62CC"]);
const MANI=["Dibujar por el acto mismo de hacerlo. No hay una finalidad clara ni la obligación de llegar a algún lado. Ninguna línea tiene que convertirse en algo, ni ninguna hoja merece, necesariamente, ser reconocida.",
"No hay intención de hacer ARTE, con mayúsculas. Hay ganas de probar, jugar, equivocarse y encontrar algo que, la mayoría de las veces, no se buscaba.",
"No se crea para otros. No hay encargo, público ni expectativa. Ningún dibujo está mal: puede gustarnos o no, pero no hay un tribunal al que rendirle cuentas. Si alguien encuentra algo en los dibujos, bienvenido, pero ese no es el motivo por el que existen.",
"Un dibujo es descartable. Cumple su función mientras permite avanzar al siguiente. Una vez terminado, deja de pertenecernos un poco, y es válido abandonarlo, intervenirlo o dejarlo ir.",
"En un presente que exige velocidad, eficiencia y resultados, dibujar durante horas algo que no sirve para nada es una forma de resistencia. Es una actividad lenta, a veces absurda, difícil de justificar. Y justamente por eso, necesaria.",
"Publicar es liberar. Es sacar el dibujo del cuaderno o de la carpeta y ponerlo en circulación.",
"La tecnología, incluida la inteligencia artificial, puede ser una herramienta extraordinaria para explorar, producir e imaginar. Pero hay algo que interesa preservar: la decisión de hacer. No se trata de delegar las búsquedas, sino de encontrar nuevas formas de llevarlas adelante, manteniendo el criterio propio y humano."];
const CIERRE="Dibujar por dibujar. Lo demás es consecuencia.";
const FRASES=["Dibujar por dibujar.","Lo demás es consecuencia.","Ningún dibujo está mal.","Publicar es liberar.","Un dibujo es descartable.","La decisión de hacer.","No hay una versión final."];
const NOMB=["1990","MCMXC","unonuevenuevecero","milnuevenoventa"];
const INTER='"Inter Tight", Inter, "Helvetica Neue", Arial, sans-serif';
const GROT='"Space Grotesk", "Inter Tight", Inter, Arial, sans-serif';
const MONO='"IBM Plex Mono", "DejaVu Sans Mono", Menlo, monospace';
let FAM=INTER;
const PESOS={minimal:17,maximal:14,grafico:18,color:18,manifiesto:14,retro:19};
const SUBS={minimal:["frase","franja","firma","titulo","grano","terminal"],maximal:["capas","capas","palabras"],grafico:["glitch","franjas","bandas","columnas","mosaico","trama","ritmo"],
  color:["teoria","muestras","abanico","suave","glitch","contraste","mezcla"],manifiesto:["completo","punto","columnas","resaltado"],retro:["malla","cubos","esfera","tunel","ascii","cajas","mapa","datos","datos","ondas","consola","matriz"]};
function claveDe(seed){const r=rng((seed^0x5bd1e995)>>>0);let s=0;for(const k in PESOS)s+=PESOS[k];let v=r()*s,e="minimal";for(const k in PESOS){v-=PESOS[k];if(v<=0){e=k;break}}const L=SUBS[e];return [e,L[Math.floor(r()*L.length)]]}
const BAY=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r=>r.map(v=>(v+.5)/16));
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hex=h=>{h=h.replace("#","");if(h.length==3)h=h.split("").map(c=>c+c).join("");return[0,2,4].map(i=>parseInt(h.substr(i,2),16))};
let SH=null,FM=null;
function cargarFirma(url){return new Promise(r=>{const i=new Image();i.onload=()=>{FM=i;r()};i.src=url})}
function cargarSombra(url){return new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=i.width;c.height=i.height;const x=c.getContext('2d');x.drawImage(i,0,0);SH={w:i.width,h:i.height,d:x.getImageData(0,0,i.width,i.height).data};r()};i.src=url})}

function poster(cv,seed,dpi,fecha,dpiEt){
  const R=rng(seed), pick=a=>a[Math.floor(R()*a.length)], ch=p=>R()<p, rr=(a,b)=>a+R()*(b-a), ri=(a,b)=>Math.floor(rr(a,b+1));
  const wpick=o=>{let s=0;for(const k in o)s+=o[k];let v=R()*s;for(const k in o){v-=o[k];if(v<=0)return k}return Object.keys(o)[0]};
  const k=dpi/25.4, W=297,H=420,B=10;
  cv.width=Math.round(W*k);cv.height=Math.round(H*k);
  const x=cv.getContext('2d');x.setTransform(k,0,0,k,0,0);
  const [estilo,SUB]=claveDe(seed);
  FAM=ch(.3)?GROT:INTER;
  /* fondo y tinta */
  let bg="#FFFFFF",fg="#000000";
  if(ch(.4)){bg="#000000";fg="#FFFFFF"}
  if(estilo=="grafico"&&ch(.15)){bg=pick(PALC);fg=OSC.has(bg)?"#FFFFFF":"#000000"}
  const acc=pick(PALC);
  x.fillStyle="#fff";x.fillRect(0,0,W,H);x.fillStyle=bg;x.fillRect(B,B,W-2*B,H-2*B);
  /* grilla */
  const M=7,X0=B+M,Y0=B+M,IW=W-2*B-2*M,IH=H-2*B-2*M,G=4;
  const gtipo=wpick({"5x9":1,"4x10":1,"3col":.8,"asim":1.2});
  let cw,nr; if(gtipo=="5x9"){cw=[1,1,1,1,1];nr=9}else if(gtipo=="4x10"){cw=[1,1,1,1];nr=10}else if(gtipo=="3col"){cw=[1,1,1];nr=12}else{cw=[rr(.6,1.3),rr(1.6,3),rr(.5,1),rr(1,2)];nr=ri(8,12)}
  const NC=cw.length,sw=cw.reduce((a,b)=>a+b,0),av=IW-G*(NC-1),CX=[];let a0=X0;cw.forEach(w=>{CX.push([a0,av*w/sw]);a0+=av*w/sw+G});
  const rh=(IH-G*(nr-1))/nr;
  const cl=c=>CX[Math.max(0,Math.min(NC-1,c))][0],cr=c=>{c=Math.max(0,Math.min(NC-1,c));return CX[c][0]+CX[c][1]},ry=r=>Y0+r*(rh+G),rb=r=>Y0+r*(rh+G)+rh;
  const cell=(c0,c1,r0,r1)=>({x:cl(c0),y:ry(r0),w:cr(c1)-cl(c0),h:rb(r1)-ry(r0)});
  x.save();x.beginPath();x.rect(B,B,W-2*B,H-2*B);x.clip();
  /* ---------- tipografía (una sola familia) ---------- */
  const F=(sz,w=400,fam)=>`${w} ${sz}px ${fam||FAM}`;
  function T(s,px,py,sz,o={}){x.save();x.font=F(sz,o.w||400,o.f);x.fillStyle=o.c||fg;x.translate(px,py);if(o.rot)x.rotate(o.rot);x.scale(o.exp||1,1);x.textAlign=o.al||"left";x.fillText(o.up?s.toUpperCase():s,0,0);x.restore()}
  const ancho=(s,sz,w,exp=1)=>{x.font=F(sz,w);return x.measureText(s).width*exp};
  function lineas(t,wd,sz,w,f){x.font=F(sz,w,f);const sp=x.measureText(" ").width,ls=[];let l=[],lw=0;for(const p of t.split(" ")){const pw=x.measureText(p).width;if(l.length&&lw+sp+pw>wd){ls.push(l);l=[];lw=0}lw+=(l.length?sp:0)+pw;l.push(p)}if(l.length)ls.push(l);return ls}
  function caja(t,r,sz,o={}){const w=o.w||400,lh=sz*(o.lh||1.2),ls=lineas(t,r.w,sz,w,o.f);x.font=F(sz,w,o.f);const sp=x.measureText(" ").width;let y=r.y+sz*.8;
    ls.forEach((l,i)=>{if(y>r.y+r.h)return;const ult=i==ls.length-1,tw=l.reduce((a,p)=>a+x.measureText(p).width,0),gap=o.just&&!ult?(r.w-tw)/Math.max(1,l.length-1):sp;let px=r.x;
      for(const p of l){x.fillStyle=o.c||fg;x.fillText(p,px,y);px+=x.measureText(p).width+gap}y+=lh});return ls.length*lh}
  function ajustar(t,r,w,lh=1.2){let lo=1,hi=60;for(let i=0;i<18;i++){const m=(lo+hi)/2;if(lineas(t,r.w,m,w).length*m*lh<=r.h-m*.3)lo=m;else hi=m}return lo}
  const linea=(x1,y1,x2,y2,g=.3,c=fg)=>{x.strokeStyle=c;x.lineWidth=g;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke()};
  const rect=(r,c)=>{x.fillStyle=c;x.fillRect(r.x,r.y,r.w,r.h)};
  /* ---------- texturas ---------- */
  /* grano: degradé con ruido (como fotocopia), escrito pixel por pixel */
  function grano(r,fn,cA,cB){const X1=Math.max(0,Math.round(r.x*k)),Y1=Math.max(0,Math.round(r.y*k)),w=Math.min(cv.width-X1,Math.round(r.w*k)),h=Math.min(cv.height-Y1,Math.round(r.h*k));if(w<1||h<1)return;
    x.save();x.setTransform(1,0,0,1,0,0);const im=x.getImageData(X1,Y1,w,h),d=im.data,A=hex(cA),Bc=hex(cB),gs=Math.max(1,Math.round(k*.12));
    for(let j=0;j<h;j+=gs)for(let i=0;i<w;i+=gs){const v=fn(i/w,j/h),c=R()<v?A:Bc;for(let jj=j;jj<Math.min(h,j+gs);jj++)for(let ii=i;ii<Math.min(w,i+gs);ii++){const o=(jj*w+ii)*4;d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2];d[o+3]=255}}
    x.putImageData(im,X1,Y1);x.restore()}
  /* glitch como patrón (vertical u horizontal), en dos o más tintas */
  function glitch(r,tintas,cs=1.75,vert=true){const nx=Math.ceil(r.w/cs),ny=Math.ceil(r.h/cs),N=vert?nx:ny,L=vert?ny:nx;
    for(let a=0;a<N;){const g=Math.min(N-a,pick([1,1,2,3,5,8,13]));let b=0;const base=Math.floor(R()*tintas.length);
      while(b<L){const run=Math.min(L-b,1+Math.floor(R()*R()*L));const c=ch(.75)?tintas[base]:pick(tintas);x.fillStyle=c;
        if(vert)x.fillRect(r.x+a*cs,r.y+b*cs,g*cs+.02,run*cs+.02);else x.fillRect(r.x+b*cs,r.y+a*cs,run*cs+.02,g*cs+.02);b+=run}a+=g}}
  /* franjas con ritmo progresivo y fila de damero */
  function franjas(r,c1,c2,vert=true){const n=ri(10,26),q=rr(.85,1.15);let ws=[],w=1;for(let i=0;i<n;i++){ws.push(w);w*=q}const s=ws.reduce((a,b)=>a+b,0),L=vert?r.w:r.h;let p=0;
    ws.forEach((v,i)=>{const t=v/s*L;x.fillStyle=i%2?c2:c1;if(vert)x.fillRect(r.x+p,r.y,t+.02,r.h);else x.fillRect(r.x,r.y+p,r.w,t+.02);p+=t});
    if(ch(.6)&&vert){const hh=Math.min(r.h*.08,8);p=0;ws.forEach((v,i)=>{const t=v/s*L;x.fillStyle=i%2?c1:c2;x.fillRect(r.x+p,r.y+r.h-hh,t+.02,hh);p+=t})}}
  /* bandas horizontales con cortes y rótulos */
  function bandas(r,tintas,rotulos){const n=ri(10,22),h=r.h/n;for(let i=0;i<n;i++){let px=r.x;const y=r.y+i*h;while(px<r.x+r.w){const w=Math.min(r.x+r.w-px,ch(.6)?r.w:rr(5,r.w*.5));x.fillStyle=pick(tintas);x.fillRect(px,y,w+.02,h*(ch(.15)?.6:1)+.02);px+=w}
      if(rotulos&&ch(.3)){const t=pick(rotulos);T(t,r.x+rr(.2,.75)*r.w,y+h*.7,Math.min(3,h*.5),{w:400,c:fg})}}}
  /* columnas con degradé escalonado (con grano) */
  function columnasDeg(r,cA,cB){const n=ri(3,6),gw=r.w/n,dir=ch(.5);for(let i=0;i<n;i++){const off=(dir?i:n-1-i)/n*.45;grano({x:r.x+i*gw,y:r.y,w:gw,h:r.h},(u,v)=>Math.max(0,Math.min(1,1-(v-.2-off)/.45)),cA,cB)}}
  /* mosaico de rectángulos con degradé (grilla) */
  function mosaico(r,cA,cB){const c=ri(3,5),f=ri(5,9),cw2=r.w/c;for(let i=0;i<c;i++){let y=r.y;while(y<r.y+r.h-1){const h=Math.min(r.y+r.h-y,r.h/f*pick([1,1,2,3]));const up=ch(.5),flat=ch(.35);
      if(flat)rect({x:r.x+i*cw2,y,w:cw2,h},ch(.5)?cA:cB);else grano({x:r.x+i*cw2,y,w:cw2,h},(u,v)=>up?v:1-v,cA,cB);y+=h}}}
  /* firma (lisa) */
  function firma(r,c){if(!FM)return;const asp=FM.height/FM.width;let w=r.w,h=w*asp;if(h>r.h){h=r.h;w=h/asp}const ox=r.x+r.w-w,oy=r.y+(r.h-h)/2;
    const t=document.createElement("canvas");t.width=FM.width;t.height=FM.height;const tx=t.getContext("2d");tx.fillStyle=c;tx.fillRect(0,0,t.width,t.height);tx.globalCompositeOperation="destination-in";tx.drawImage(FM,0,0);
    x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";x.drawImage(t,ox,oy,w,h)}
  /* pie suizo con variantes de lugar: abajo, arriba o título vertical al costado */
  let pieLugar=null;
  function pie(titulo,cols){const lugar=pieLugar||pick(["abajo","abajo","arriba","lado"]);pieLugar=lugar;const tw=pick([400,500,600,700]),tsz=Math.min(rh*rr(.7,1.25),(IW*.5)/Math.max(3,titulo.length)*1.7);
    if(lugar=="lado"){T(titulo,X0+tsz*.78,rb(nr-1),tsz,{w:tw,rot:-Math.PI/2});cols.slice(0,3).forEach((t,i)=>caja(t,{x:X0+tsz+4,y:rb(nr-1)-42+i*14,w:34,h:13},2.3,{w:400}));return}
    const yb=lugar=="abajo"?rb(nr-1):ry(0)+tsz*.78;T(titulo,X0,yb,tsz,{w:tw});const fin=X0+ancho(titulo,tsz,tw)+8;
    const x0=Math.max(fin,cl(Math.ceil(NC/2))),n=Math.min(cols.length,Math.max(1,Math.floor((X0+IW-x0)/40))),cwid=(X0+IW-x0-4*(n-1))/n,ty=lugar=="abajo"?yb-11:ry(0);
    cols.slice(0,n).forEach((t,i)=>caja(t,{x:x0+i*(cwid+4),y:ty,w:cwid,h:14},2.5,{w:i==0?400:500}));}
  /* zona libre según dónde va el pie */
  const zona=()=>pieLugar=="arriba"?cell(0,NC-1,2,nr-1):pieLugar=="lado"?{x:X0+rh*1.4,y:Y0,w:IW-rh*1.4,h:IH}:cell(0,NC-1,0,nr-3);
  /* texto tipo terminal (monoespaciada) */
  function terminal(r,lineasT,sz=2.6,col){let y=r.y+sz;for(const l of lineasT){if(y>r.y+r.h)break;const c=l.startsWith("[FAIL")?(acc||col):col||fg;T(l,r.x,y,sz,{w:400,f:MONO,c});y+=sz*1.45}}
  const LOG=()=>["> 1990 --render --semilla="+(seed>>>0).toString(36),"[ OK ] grilla "+gtipo+" · "+NC+" col × "+nr+" filas","[ OK ] paleta catarsis: 7 tintas + negro + blanco","[ OK ] tipografía: "+(FAM==GROT?"Space Grotesk":"Inter Tight")+" / IBM Plex Mono","[WARN] señal corrida en fila "+ri(1,240),"[ OK ] obras en archivo: 56 · papelera: 13","[INFO] el azar decide, el archivo pone las reglas","[FAIL] versión final no encontrada","> ignorar? s","[ OK ] exportando A3 297×420","_"];
  const fechaCorta=fecha.slice(0,10);
  const info=()=>[pick(FRASES)+" "+pick(FRASES),"unonuevenuevecero\nArchivo gráfico experimental".replace("\n"," · "),fechaCorta+" · #"+(seed>>>0).toString(36).toUpperCase()];

  /* ======================= ESTILOS ======================= */
  const EST={
  minimal(){ /* pocos elementos, mucho aire */
    pieLugar=pick(["abajo","arriba","lado","abajo"]);const m=SUB;
    if(m=="terminal"){terminal(cell(ri(0,NC-2),NC-1,ri(2,nr-4),nr-2),LOG().slice(0,ri(2,5)),2.6)}
    if(m=="frase"){const f=pick(FRASES);T(f,X0,ry(ri(1,4))+8,pick([7,10,14]),{w:pick([300,400,600])});}
    if(m=="franja"){const c=ri(0,NC-1);const r=cell(c,c,ri(0,2),nr-3);rect({x:r.x,y:r.y,w:ch(.5)?r.w:2,h:r.h},ch(.35)?acc:fg)}
    if(m=="firma"){const c0=ri(1,NC-1);firma(cell(c0,NC-1,ri(1,3),ri(3,5)),ch(.3)?acc:fg)}

  el.textContent=""; const sp=[...txt].map(c=>{ const s=document.createElement("span"); s.setAttribute("aria-hidden","true"); const i=document.createElement("i"); i.textContent=c; s.appendChild(i); el.appendChild(s); return {i,c}; });
  const t0=performance.now();
  (function f(t){ let vivo=false; sp.forEach((o,k)=>{ const fin=900+k*170; if(t-t0<fin){ vivo=true; const ch=AZ[Math.floor(Math.random()*AZ.length)]; o.i.textContent=k?ch.toLowerCase():ch; o.i.style.transform=`translateY(${(Math.random()*30-15).toFixed(0)}%)`; } else { o.i.textContent=o.c; o.i.style.transform=""; } });
    if(vivo) setTimeout(()=>requestAnimationFrame(f),55); else el.textContent=txt; })(t0); }
const nombre=()=>"1990_generativeposter_"+fecha;
function bajar(blob,n){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=n; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000); }
function ocupado(b,on,t){ document.querySelectorAll(".acc button").forEach(x=>x.disabled=on); $("#est").textContent=t||""; }
async function png(){ ocupado(1,true,"Preparando PNG (150 dpi)…"); await new Promise(r=>setTimeout(r,30));
  const c=document.createElement("canvas"); poster(c,semilla,150,fecha,150); c.toBlob(b=>{ bajar(b,nombre()+".png"); ocupado(0,false,"PNG listo: 1754 × 2480 px."); },"image/png"); }
/* PDF A3 a 300 dpi: una imagen JPEG dentro de un PDF armado a mano (sin librerías) */
async function pdf(){ ocupado(1,true,"Preparando PDF A3 (300 dpi)… puede tardar unos segundos."); await new Promise(r=>setTimeout(r,30));
  const c=document.createElement("canvas"); poster(c,semilla,300,fecha,300);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.93)), jpg=new Uint8Array(await blob.arrayBuffer());
  bajar(armarPDF(jpg,c.width,c.height),nombre()+".pdf"); ocupado(0,false,"PDF listo: A3, 300 dpi."); }
function armarPDF(jpg,w,h){ const enc=new TextEncoder(), partes=[], off=[]; let len=0;
  const add=b=>{ if(typeof b==="string") b=enc.encode(b); partes.push(b); len+=b.length; };
  const obj=(n,s,bin)=>{ off[n]=len; add(n+" 0 obj\n"+s); if(bin){ add(bin); add("\nendstream"); } add("\nendobj\n"); };
  const PW=841.89, PH=1190.55, cont=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  add("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  obj(4,`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`,jpg);
  obj(5,`<< /Length ${cont.length} >>\nstream\n`,enc.encode(cont));
  const xref=len; let t="xref\n0 6\n0000000000 65535 f \n"; for(let i=1;i<=5;i++) t+=String(off[i]).padStart(10,"0")+" 00000 n \n";
  add(t+"trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF");
  return new Blob(partes,{type:"application/pdf"}); }
async function copiarLink(){ try{ await navigator.clipboard.writeText(location.href); $("#est").textContent="Enlace copiado: quien lo abra ve este mismo póster."; }catch(_){ $("#est").textContent=location.href; } }
